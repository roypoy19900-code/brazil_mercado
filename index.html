<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A表格转C表格处理工具 (GitHub版)</title>
    <!-- 引入 SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 30px;
            text-align: center;
        }

        h1 { color: #333; margin-bottom: 10px; }
        p.subtitle { color: #666; margin-bottom: 30px; }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: #f9f9f9;
        }
        .upload-area:hover { border-color: var(--primary-color); background: #f0f4ff; }
        
        input[type="file"] { display: none; }
        
        .btn-main {
            background: var(--bg-gradient);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.3s;
        }
        .btn-main:disabled { background: #ccc; cursor: not-allowed; }
        .btn-main:hover:not(:disabled) { opacity: 0.9; }

        .input-group {
            text-align: left;
            margin: 20px 0;
        }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* 日志区域 */
        .log-container {
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Consolas', monospace;
            text-align: left;
            padding: 15px;
            border-radius: 6px;
            height: 200px;
            overflow-y: auto;
            margin-top: 20px;
            font-size: 14px;
            border: 1px solid #333;
        }

        .download-section {
            margin-top: 20px;
            display: none; /* 默认隐藏 */
        }
        .btn-download {
            background: #4CAF50;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>A表格转C表格处理工具</h1>
    <p class="subtitle">上传A表格文件，自动按照执行步骤生成C表格</p>

    <!-- 1. 文件上传 -->
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <span id="fileName">点击此处上传 A表格 (.xlsx)</span>
        <input type="file" id="fileInput" accept=".xlsx, .xls" onchange="handleFileSelect(this)">
    </div>

    <!-- 2. 用户输入 (第10步使用) -->
    <div class="input-group">
        <label for="shopUrl">店铺网址 (第10步使用):</label>
        <input type="text" id="shopUrl" placeholder="请输入店铺网址，例如: https://..." value="123123">
    </div>

    <!-- 3. 开始按钮 -->
    <button id="processBtn" class="btn-main" onclick="startProcessing()" disabled>开始处理</button>

    <!-- 4. 运行日志 -->
    <div class="log-container" id="logBox">等待操作...</div>

    <!-- 5. 下载区域 -->
    <div class="download-section" id="downloadSection">
        <p>处理完成！请点击下方按钮下载。</p>
        <a id="downloadLink" class="btn-download" href="#" download="C表格_处理后.xlsx">下载C表格</a>
    </div>
</div>

<script>
    // 配置部分
    const TEMPLATE_URL = './C表格.xlsx'; // GitHub上的C表格路径
    let uploadedWorkbook = null; // 存储用户上传的A表格
    let uploadedFileName = "A表格";

    // 日志功能
    function log(msg, type = 'INFO') {
        const logBox = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString();
        const color = type === 'ERROR' ? '#ff4444' : '#00ff00';
        logBox.innerHTML += `<div style="color:${color}">[${time}] [${type}] ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // 1. 处理文件选择
    function handleFileSelect(input) {
        const file = input.files[0];
        if (!file) return;

        uploadedFileName = file.name.replace(/\.[^/.]+$/, ""); // 去除后缀
        document.getElementById('fileName').innerText = `已选择: ${file.name}`;
        document.getElementById('processBtn').disabled = false;
        log(`文件已加载: ${file.name}`);

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            uploadedWorkbook = XLSX.read(data, {type: 'array'});
            log("A表格解析成功，等待处理...");
        };
        reader.readAsArrayBuffer(file);
    }

    // 2. 核心处理逻辑
    async function startProcessing() {
        const btn = document.getElementById('processBtn');
        const shopUrl = document.getElementById('shopUrl').value;
        
        if (!uploadedWorkbook) {
            alert("请先上传A表格！");
            return;
        }

        btn.disabled = true;
        btn.innerText = "正在处理中...";
        log("--- 开始执行处理步骤 ---");

        try {
            // 第一步：获取 C表格 (模板)
            log("正在从服务器获取 C表格 模板...");
            const templateResponse = await fetch(TEMPLATE_URL);
            if (!templateResponse.ok) throw new Error("无法下载C表格模板，请检查文件是否存在于GitHub根目录");
            
            const templateBuffer = await templateResponse.arrayBuffer();
            const templateWorkbook = XLSX.read(templateBuffer, {type: 'array'});
            
            // 假设都在第一个 Sheet
            const templateSheetName = templateWorkbook.SheetNames[0];
            const templateSheet = templateWorkbook.Sheets[templateSheetName];
            
            // 将模板转换为二维数组，方便操作
            // header:1 表示生成二维数组 [[A1, B1...], [A2, B2...]]
            let cData = XLSX.utils.sheet_to_json(templateSheet, {header: 1});
            
            log(`C表格模板加载成功，当前行数: ${cData.length}`);

            // 第二步：处理 A表格 (数据源)
            const sourceSheetName = uploadedWorkbook.SheetNames[0];
            const sourceSheet = uploadedWorkbook.Sheets[sourceSheetName];
            // 同样转为二维数组
            const aData = XLSX.utils.sheet_to_json(sourceSheet, {header: 1});

            if (aData.length < 2) {
                throw new Error("A表格似乎没有数据或为空");
            }

            // 获取表头 (第一行)，用于调试确认列位置
            const headers = aData[0];
            // 调试日志：打印第49列(索引48)的表头名称，确认是不是AW列
            log(`A表格表头检测 - 第49列(AW列)名称为: "${headers[48]}"`); 

            let matchCount = 0;
            let skipCount = 0;

            // 第三步：遍历 A表格 进行筛选和填入
            // 从 i=1 开始，跳过表头
            for (let i = 1; i < aData.length; i++) {
                const row = aData[i];
                
                // *** 关键筛选逻辑 ***
                // 获取 AW 列的值 (Excel中 A=0 ... AW=48)
                // 使用 trim() 去除可能存在的首尾空格
                const formaEntregaVal = row[48] ? String(row[48]).trim() : "";

                // 检查是否符合条件
                if (formaEntregaVal === "Mercado Envios Full") {
                    // --- 符合筛选条件 ---
                    
                    // 【注意】这里需要根据你的实际业务逻辑修改映射关系
                    // 目前逻辑：直接将A表格的这一整行数据，追加到C表格的末尾
                    // 如果C表格的列顺序和A不一样，你需要在这里手动赋值，例如：
                    // const newRow = [];
                    // newRow[0] = row[0]; // A列填到A列
                    // newRow[5] = shopUrl; // 将店铺网址填入F列
                    // cData.push(newRow);
                    
                    // 简单模式：直接推入 (假设列结构相似或需要保留原样)
                    // 为了防止空行报错，确保row是数组
                    const rowToPush = Array.isArray(row) ? row : [];
                    
                    // 如果需要在此处执行“第10步”填入店铺网址
                    // 假设店铺网址要填在每一行的最后一列，或者指定列（比如第10列，索引9）
                    // rowToPush[9] = shopUrl; // 举例：填入第J列
                    
                    cData.push(rowToPush);
                    matchCount++;
                } else {
                    skipCount++;
                }
            }

            log(`筛选完成。匹配 "Mercado Envios Full": ${matchCount} 行，跳过: ${skipCount} 行。`);
            log(`正在将数据写入 C表格...`);

            // 第四步：生成新的 Excel
            const newSheet = XLSX.utils.aoa_to_sheet(cData);
            templateWorkbook.Sheets[templateSheetName] = newSheet;

            // 导出文件
            const wbout = XLSX.write(templateWorkbook, {bookType:'xlsx', type:'array'});
            const blob = new Blob([wbout], {type:"application/octet-stream"});
            const url = URL.createObjectURL(blob);

            // 设置下载链接
            const dlLink = document.getElementById('downloadLink');
            dlLink.href = url;
            dlLink.download = `C表格_处理后_${new Date().getTime()}.xlsx`;
            
            document.getElementById('downloadSection').style.display = 'block';
            log("处理全部完成！文件已生成。");

        } catch (err) {
            console.error(err);
            log(`发生错误: ${err.message}`, 'ERROR');
            alert("处理出错，请查看日志或联系开发者。\n错误信息: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "开始处理";
        }
    }
</script>

</body>
</html>
