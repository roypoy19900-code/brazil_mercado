<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A表转C表自动化处理工具</title>
    <!-- 引入 SheetJS (xlsx) 库 -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 500px; max-width: 90%; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 日志区域样式 */
        .log-container { margin-top: 20px; background: #2d2d2d; color: #00ff00; padding: 10px; border-radius: 6px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #444; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .log-error { color: #ff4d4d; }
        .log-info { color: #00ffff; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 表格自动化处理工具</h2>

    <!-- 第10步所需的输入框 -->
    <div class="form-group">
        <label for="shopUrl">店铺网址 (用于填入C表):</label>
        <input type="text" id="shopUrl" placeholder="请输入店铺链接..." value="https://shopee.co.id/...">
    </div>

    <!-- 上传 A 表格 -->
    <div class="form-group">
        <label for="fileInput">上传 A 表格 (.xlsx / .xls):</label>
        <input type="file" id="fileInput" accept=".xlsx, .xls">
    </div>

    <button id="processBtn" onclick="startProcess()">开始处理并生成 C 表格</button>

    <!-- 运行日志显示区 -->
    <div class="log-container" id="logBox">
        <div class="log-entry">等待操作...</div>
    </div>
</div>

<script>
    // 日志功能函数
    function addLog(msg, type = 'normal') {
        const logBox = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = 'log-entry';
        
        let colorClass = '';
        if (type === 'error') colorClass = 'log-error';
        if (type === 'info') colorClass = 'log-info';
        
        div.innerHTML = `<span style="color:#888">[${time}]</span> <span class="${colorClass}">${msg}</span>`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight; // 自动滚动到底部
        console.log(msg);
    }

    async function startProcess() {
        const fileInput = document.getElementById('fileInput');
        const shopUrl = document.getElementById('shopUrl').value.trim();
        const btn = document.getElementById('processBtn');

        // 1. 基础校验
        if (!fileInput.files.length) {
            addLog("错误：请先选择 A 表格文件！", "error");
            return;
        }
        if (!shopUrl) {
            addLog("警告：店铺网址为空，请确认是否继续。", "error");
            // 这里可以根据需求决定是否强制阻断，暂时只警告
        }

        const file = fileInput.files[0];
        btn.disabled = true;
        btn.innerText = "处理中...";
        addLog(`开始读取文件: ${file.name}`, "info");

        try {
            // 2. 读取文件 (FileReader)
            const data = await readFileAsync(file);
            addLog("文件读取成功，正在解析...", "info");

            // 3. 解析 Excel (SheetJS)
            const workbook = XLSX.read(data, { type: 'array' });
            
            // 获取第一个工作表
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // 将 Sheet 转换为 JSON 对象数组 (header:1 表示按行数组读取，方便后续处理)
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            addLog(`解析成功，共读取到 ${jsonData.length} 行数据`, "info");

            // ==========================================
            // 核心逻辑区域：模拟《文件执行步骤》
            // ==========================================
            
            // 假设我们要创建一个新的 C 表格数据结构
            // C表的第一行通常是表头
            let cTableData = [];
            cTableData.push(["商品名称", "价格", "库存", "店铺网址"]); // 示例表头

            // 遍历 A 表数据 (跳过第一行表头，从 i=1 开始)
            for (let i = 1; i < jsonData.length; i++) {
                const row = jsonData[i];
                if (!row || row.length === 0) continue;

                // --- 在这里编写具体的转换逻辑 ---
                // 示例逻辑：
                // 假设 A 表第1列是品名，第2列是价格
                
                let itemA_Name = row[0] || "未知商品"; 
                let itemA_Price = row[1] || 0;
                
                // 模拟第10步：填入用户输入的网址
                let finalShopUrl = shopUrl; 

                // 构建 C 表的一行
                let newRow = [
                    itemA_Name,      // C表列1
                    itemA_Price,     // C表列2
                    100,             // C表列3 (示例固定值)
                    finalShopUrl     // 第10步要求的自动填入
                ];
                
                cTableData.push(newRow);
            }

            addLog("数据处理完成，正在生成 C 表格...", "info");

            // 4. 生成新的 Workbook
            const newWs = XLSX.utils.aoa_to_sheet(cTableData); // Array of Arrays to Sheet
            const newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, newWs, "Sheet1");

            // 5. 导出下载
            const fileName = `C_表格_${new Date().getTime()}.xlsx`;
            XLSX.writeFile(newWb, fileName);
            
            addLog(`✅ 成功！文件 ${fileName} 已开始下载`, "info");

        } catch (err) {
            console.error(err);
            addLog(`❌ 发生严重错误: ${err.message}`, "error");
        } finally {
            btn.disabled = false;
            btn.innerText = "开始处理并生成 C 表格";
        }
    }

    // 辅助函数：将 FileReader 封装为 Promise
    function readFileAsync(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(e);
            reader.readAsArrayBuffer(file); // 关键：必须读为 ArrayBuffer
        });
    }
</script>

</body>
</html>
