<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A表转C表自动化处理工具</title>
    <!-- 引入 SheetJS 库 -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 500px; max-width: 90%; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 日志区域样式 */
        .log-container { margin-top: 20px; background: #2d2d2d; color: #00ff00; padding: 10px; border-radius: 6px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #444; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .log-error { color: #ff4444; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 表格处理工具</h2>

    <!-- 第10步需要的输入框 -->
    <div class="form-group">
        <label for="shopUrl">店铺网址 (用于填入C表):</label>
        <input type="text" id="shopUrl" placeholder="请输入店铺网址，例如 https://shopee..." value="https://shopee.com.br/test">
    </div>

    <!-- 上传 A 表格 -->
    <div class="form-group">
        <label for="fileInput">上传 A 表格:</label>
        <input type="file" id="fileInput" accept=".xlsx, .xls">
    </div>

    <button id="processBtn" onclick="startProcess()">开始生成 C 表格</button>

    <!-- 运行日志 -->
    <div class="log-container" id="logBox">
        <div class="log-entry">等待任务开始...</div>
    </div>
</div>

<script>
    // 日志工具函数
    function log(message, isError = false) {
        const logBox = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = 'log-entry' + (isError ? ' log-error' : '');
        div.innerText = `[${time}] ${message}`;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight; // 自动滚动到底部
        console.log(message);
    }

    async function startProcess() {
        const fileInput = document.getElementById('fileInput');
        const shopUrl = document.getElementById('shopUrl').value;
        const btn = document.getElementById('processBtn');

        // 1. 基础检查
        if (!fileInput.files.length) {
            alert("请先选择 A 表格文件！");
            return;
        }
        if (!shopUrl) {
            alert("请输入店铺网址！");
            return;
        }

        const file = fileInput.files[0];
        btn.disabled = true;
        btn.innerText = "处理中...";
        log(`--- 开始处理文件: ${file.name} ---`);

        try {
            // 2. 读取文件 (ArrayBuffer)
            const data = await file.arrayBuffer();
            log("文件读取成功，正在解析...");

            // 3. 解析 A 表格 (Workbook 对象)
            // 这里的 bookA 就是内存中的 Excel 对象，不需要 HTML table
            const workbookA = XLSX.read(data, { type: 'array' });
            
            // 默认取第一个 Sheet
            const sheetNameA = workbookA.SheetNames[0];
            const worksheetA = workbookA.Sheets[sheetNameA];
            
            // 将 Sheet 转换为 JSON 数组 (二维数组模式，header:1 表示按行读取)
            // 如果你想按列名读取，可以用 header:0，但处理逻辑会不同
            const jsonDataA = XLSX.utils.sheet_to_json(worksheetA, { header: 1 });

            log(`A 表格解析完成，共 ${jsonDataA.length} 行数据。`);

            // ==========================================
            // 【核心逻辑区】在这里编写你的《文件执行步骤》
            // ==========================================
            
            // 假设我们要创建一个新的 C 表格数据
            let dataForC = [];

            // 示例：添加 C 表的表头
            // 请根据你的实际需求修改这些列名
            dataForC.push(["商品名称", "价格", "库存", "店铺网址"]); 

            // 遍历 A 表数据 (跳过第一行表头，从 i=1 开始)
            for (let i = 1; i < jsonDataA.length; i++) {
                const rowA = jsonDataA[i];
                
                // 模拟逻辑：从 A 表取值，加工后放入 C 表
                // rowA[0] 代表 A 表的第一列，rowA[1] 代表第二列...
                
                // 这里只是演示，你需要根据 Word 文档的逻辑来写
                let itemTitle = rowA[0] || "未知商品"; 
                let price = rowA[1] || 0;
                
                // 组装 C 表的一行
                let newRow = [
                    itemTitle,      // C表第1列
                    price,          // C表第2列
                    100,            // C表第3列 (假设固定库存)
                    shopUrl         // 第10步：填入用户输入的网址
                ];
                
                dataForC.push(newRow);
            }

            log("数据处理完毕，正在生成 C 表格...");

            // ==========================================
            // 生成并下载 C 表格
            // ==========================================
            
            // 1. 将二维数组转换为 Sheet
            const worksheetC = XLSX.utils.aoa_to_sheet(dataForC);
            
            // 2. 创建新的 Workbook
            const workbookC = XLSX.utils.book_new();
            
            // 3. 将 Sheet 添加到 Workbook，命名为 "Sheet1" 或 "Result"
            XLSX.utils.book_append_sheet(workbookC, worksheetC, "生成结果");

            // 4. 导出下载
            XLSX.writeFile(workbookC, "C_表格结果.xlsx");

            log("✅ 成功！C 表格已下载。", false);

        } catch (error) {
            console.error(error);
            log(`❌ 发生错误: ${error.message}`, true);
        } finally {
            btn.disabled = false;
            btn.innerText = "开始生成 C 表格";
        }
    }
</script>

</body>
</html>
