<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单数据自动化处理工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --text-color: #333;
            --border-color: #ddd;
            --success-color: #28a745;
            --error-color: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        .upload-area {
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background-color: #e8f0fe;
        }

        .upload-area p {
            margin: 0;
            font-size: 1.1em;
            color: var(--primary-color);
        }

        #file-input {
            display: none;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .log-container {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        #log-output {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-info { color: var(--text-color); }
        .log-success { color: var(--success-color); font-weight: bold; }
        .log-error { color: var(--error-color); font-weight: bold; }

        .progress-bar {
            width: 100%;
            height: 5px;
            background-color: var(--secondary-color);
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>订单数据自动化处理工具</h1>

        <div id="upload-area" class="upload-area">
            <p>点击或拖拽文件到此处上传A表格</p>
            <input type="file" id="file-input" accept=".xlsx, .xls">
        </div>

        <div class="input-group">
            <label for="shop-url">店铺网址 (用于第10步)</label>
            <input type="text" id="shop-url" placeholder="请输入店铺网址">
        </div>

        <button id="process-btn" class="btn" disabled>开始处理</button>
        
        <div class="progress-bar" id="progress-bar">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>

        <div class="log-container">
            <h3>运行日志</h3>
            <div id="log-output"></div>
            <button id="clear-log-btn" class="btn" style="margin-top: 10px; background-color: #6c757d;">清空日志</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const processBtn = document.getElementById('process-btn');
        const logOutput = document.getElementById('log-output');
        const progressBar = document.getElementById('progress-bar');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const clearLogBtn = document.getElementById('clear-log-btn');

        let uploadedFile = null;

        // --- 日志系统 ---
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logOutput.appendChild(entry);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function clearLog() {
            logOutput.innerHTML = '';
        }

        // --- 文件上传处理 ---
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.backgroundColor = '#e8f0fe';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.backgroundColor = 'transparent';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.backgroundColor = 'transparent';
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file) {
                uploadedFile = file;
                log(`文件已选择: ${file.name}`, 'success');
                processBtn.disabled = false;
            }
        }

        // --- 核心处理逻辑 ---
        processBtn.addEventListener('click', async () => {
            if (!uploadedFile) return;

            const shopUrl = document.getElementById('shop-url').value.trim();
            if (!shopUrl) {
                log('错误：请输入店铺网址。', 'error');
                return;
            }

            processBtn.disabled = true;
            progressBar.style.display = 'block';
            progressBarFill.style.width = '10%';
            clearLog();
            log('开始处理文件...');

            try {
                const data = await uploadedFile.arrayBuffer();
                const workbook = XLSX.read(data);
                const sheetName = workbook.SheetNames[0];
                let worksheet = workbook.Sheets[sheetName];

                log('步骤 1: 正在删除前5行...');
                // 1. 删除前5行
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                const processedData = jsonData.slice(5);
                log(`步骤 1 完成。剩余 ${processedData.length} 行数据。`);
                progressBarFill.style.width = '20%';

                log('步骤 2: 正在重命名列...');
                // 2. 重命名列
                const headers = processedData[0];
                const headerMap = {
                    'N.º de venda': '订单编号',
                    'Unidades': '商品数量',
                    'Total (BRL)': '订单金额',
                    'Data da venda': '订单日期',
                    'Transportador': '物流企业名称',
                    'Número de rastreamento': '快递单号',
                    'Título do anúncio': '商品名称'
                };
                const newHeaders = headers.map(h => headerMap[h] || h);
                processedData[0] = newHeaders;
                log('步骤 2 完成。');
                progressBarFill.style.width = '30%';

                log('步骤 3: 正在筛选并删除无效行...');
                // 3. 筛选并删除
                const colIndex = {};
                newHeaders.forEach((h, i) => colIndex[h] = i);

                const initialCount = processedData.length;
                const filteredData = processedData.filter((row, index) => {
                    if (index === 0) return true; // 保留表头

                    const qty = parseFloat(row[colIndex['商品数量']]);
                    const amount = parseFloat(row[colIndex['订单金额']]);
                    const tracking = String(row[colIndex['快递单号']]).trim();
                    const status = String(row[colIndex['Estado']]).trim();

                    if ((!qty && qty !== 0) || qty === 0) return false;
                    if ((!amount && amount !== 0) || amount === 0) return false;
                    if (tracking === '0' || tracking === '') return false;
                    if (status !== 'Entregue') return false;

                    return true;
                });
                const deletedCount = initialCount - filteredData.length;
                log(`步骤 3 完成。删除了 ${deletedCount} 行无效数据。`);
                progressBarFill.style.width = '40%';

                log('步骤 4: 正在处理订单编号...');
                // 4. 处理订单编号 (模拟B.xlsx函数)
                const orderCount = {};
                filteredData.forEach((row, index) => {
                    if (index === 0) return;
                    const orderId = row[colIndex['订单编号']];
                    if (orderCount[orderId]) {
                        orderCount[orderId]++;
                        row[colIndex['订单编号']] = `${orderId}-${orderCount[orderId]}`;
                    } else {
                        orderCount[orderId] = 0;
                    }
                });
                log('步骤 4 完成。');
                progressBarFill.style.width = '50%';

                log('步骤 5: 正在转换日期格式...');
                // 5. 转换日期格式
                const monthMap = {
                    'janeiro': '01', 'fevereiro': '02', 'março': '03', 'abril': '04',
                    'maio': '05', 'junho': '06', 'julho': '07', 'agosto': '08',
                    'setembro': '09', 'outubro': '10', 'novembro': '11', 'dezembro': '12'
                };
                filteredData.forEach((row, index) => {
                    if (index === 0) return;
                    const dateStr = String(row[colIndex['订单日期']]);
                    const dateRegex = /(\d{1,2}) de ([a-z]+) de (\d{4})/;
                    const match = dateStr.match(dateRegex);
                    if (match) {
                        const day = match[1].padStart(2, '0');
                        const month = monthMap[match[2]];
                        const year = match[3];
                        row[colIndex['订单日期']] = `${year}/${month}/${day}`;
                    }
                });
                log('步骤 5 完成。');
                progressBarFill.style.width = '60%';

                log('步骤 6-9: 正在生成C表格...');
                // 6-9. 生成C表格
                const cHeaders = ['订单编号', '订单日期', '订单币种', '订单金额', '商品名称', '商品数量', '商品单价', '店铺网址', '快递单号', '物流企业名称', '电商平台英文名称'];
                const cData = [cHeaders];
                
                filteredData.forEach((row, index) => {
                    if (index === 0) return;
                    const cRow = [];
                    cRow[0] = row[colIndex['订单编号']]; // A
                    cRow[1] = row[colIndex['订单日期']]; // B
                    cRow[2] = 'BRL'; // C
                    cRow[3] = row[colIndex['订单金额']]; // D
                    cRow[4] = row[colIndex['商品名称']]; // E
                    cRow[5] = row[colIndex['商品数量']]; // F
                    // G: 商品单价 = D/F
                    const amountVal = parseFloat(cRow[3]) || 0;
                    const qtyVal = parseFloat(cRow[5]) || 1;
                    cRow[6] = (amountVal / qtyVal).toFixed(2); 
                    cRow[7] = shopUrl; // H
                    cRow[8] = row[colIndex['快递单号']]; // I
                    cRow[9] = row[colIndex['物流企业名称']]; // J
                    cRow[10] = 'Mercado'; // K
                    cData.push(cRow);
                });
                log('步骤 6-9 完成。');
                progressBarFill.style.width = '80%';

                log('新增步骤: 正在顶部插入空白行...');
                // 新增步骤：在第1行上方添加空白行
                cData.unshift(new Array(cHeaders.length).fill(""));
                log('新增步骤完成。');
                progressBarFill.style.width = '90%';

                log('正在生成最终文件...');
                const newWorksheet = XLSX.utils.aoa_to_sheet(cData);
                const newWorkbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, '订单明细');
                
                XLSX.writeFile(newWorkbook, 'C_processed.xlsx');
                log('处理完成！文件已下载。', 'success');
                progressBarFill.style.width = '100%';

            } catch (error) {
                log(`处理出错: ${error.message}`, 'error');
                console.error(error);
            } finally {
                processBtn.disabled = false;
                progressBar.style.display = 'none';
                progressBarFill.style.width = '0%';
            }
        });

        clearLogBtn.addEventListener('click', clearLog);

    </script>
</body>
</html>
