<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴西 Mercado 表格处理工具1.2</title>
    <!-- 引入 SheetJS 库 -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; padding-top: 50px; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 600px; max-width: 90%; }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; background-color: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #357abd; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 日志区域样式 */
        #log-container { margin-top: 20px; background: #2d2d2d; color: #00ff00; padding: 15px; border-radius: 4px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; display: none; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #444; padding-bottom: 2px; }
        .log-error { color: #ff4d4d; }
        .log-warn { color: #ffcc00; }
        
        #download-area { margin-top: 20px; text-align: center; display: none; }
        .success-msg { color: green; font-weight: bold; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 表格处理工具 (A -> C)</h2>
    
    <div class="form-group">
        <label for="shopUrl">店铺网址 (用于第10步填入C表):</label>
        <input type="text" id="shopUrl" placeholder="例如: https://www.mercadolivre.com.br/..." value="">
    </div>

    <div class="form-group">
        <label for="fileInput">上传 A 表格1.2 (Excel):</label>
        <input type="file" id="fileInput" accept=".xlsx, .xls">
    </div>

    <button id="processBtn" onclick="startProcessing()">生成 C 表格</button>

    <div id="log-container"></div>

    <div id="download-area">
        <span class="success-msg">✅ 处理完成！</span>
        <button onclick="downloadFile()" style="background-color: #28a745;">下载 C 表格</button>
    </div>
</div>

<script>
    let processedWorkbook = null; // 存储生成的 workbook 对象

    // 日志记录函数
    function addLog(message, type = 'info') {
        const logContainer = document.getElementById('log-container');
        logContainer.style.display = 'block';
        const div = document.createElement('div');
        div.className = 'log-entry';
        if (type === 'error') div.classList.add('log-error');
        if (type === 'warn') div.classList.add('log-warn');
        
        const time = new Date().toLocaleTimeString();
        div.innerText = `[${time}] ${message}`;
        logContainer.appendChild(div);
        logContainer.scrollTop = logContainer.scrollHeight; // 自动滚动到底部
        console.log(`[${type.toUpperCase()}] ${message}`);
    }

    async function startProcessing() {
        const fileInput = document.getElementById('fileInput');
        const shopUrl = document.getElementById('shopUrl').value.trim();
        const btn = document.getElementById('processBtn');
        const downloadArea = document.getElementById('download-area');

        // 重置状态
        downloadArea.style.display = 'none';
        processedWorkbook = null;
        document.getElementById('log-container').innerHTML = ''; 

        if (!fileInput.files.length) {
            addLog("错误：请先选择 A 表格文件", "error");
            return;
        }
        if (!shopUrl) {
            addLog("警告：店铺网址为空，第10步将留空", "warn");
        }

        btn.disabled = true;
        btn.innerText = "处理中...";
        addLog("开始读取文件...");

        try {
            const file = fileInput.files[0];
            const data = await file.arrayBuffer();
            
            // 使用 SheetJS 读取工作簿
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            addLog(`成功读取工作表: ${firstSheetName}`);

            // --- 执行步骤 1: 删除前 5 行 ---
            // 策略：先转为 JSON (数组数组模式)，然后 slice 掉前 5 行
            // header: 1 表示生成二维数组 [[row1], [row2]...]
            let rawData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName], { header: 1 });
            addLog(`原始数据行数: ${rawData.length}。执行步骤1：删除前5行...`);
            
            if (rawData.length <= 5) throw new Error("文件行数不足，无法删除前5行");
            rawData = rawData.slice(5); // 真正的数据处理开始

            // --- 执行步骤 2: 列名替换 (假设第0行现在是表头) ---
            // 注意：如果 slice(5) 后第一行不是表头，需要调整。这里假设 slice 后第一行是旧表头。
            // 为了安全，我们构建一个映射字典。
            // *请根据你的实际葡萄牙语表头修改下面的 key*
            const headerMap = {
                "Número do pedido": "订单编号",
                "Data da compra": "下单时间",
                "Quantidade": "商品数量",
                "Valor total": "订单金额",
                "SKU": "SKU", 
                "Título do item": "商品名称"
                // ... 根据需要添加更多
            };

            let oldHeaders = rawData[0]; // 获取当前的表头行
            let newHeaders = oldHeaders.map(h => headerMap[h] || h); // 尝试替换，找不到则保留原名
            
            addLog(`步骤2完成：表头已映射。当前列: ${newHeaders.join(', ')}`);

            // 将剩余数据转为对象数组，方便后续处理
            // 手动构建对象，因为我们要跳过旧的表头行(rawData[0])，从 rawData[1] 开始
            let jsonData = [];
            for (let i = 1; i < rawData.length; i++) {
                let rowObj = {};
                let rowArr = rawData[i];
                // 简单的防错：如果行是空的，跳过
                if (!rowArr || rowArr.length === 0) continue;

                newHeaders.forEach((key, index) => {
                    rowObj[key] = rowArr[index];
                });
                jsonData.push(rowObj);
            }
            addLog(`数据清洗后剩余有效行数: ${jsonData.length}`);

            // --- 执行步骤 3: 数据筛选 ---
            // 示例逻辑：删除“订单编号”为空的行
            const initialCount = jsonData.length;
            jsonData = jsonData.filter(row => row["订单编号"]); 
            addLog(`步骤3完成：筛选后剩余 ${jsonData.length} 行 (删除了 ${initialCount - jsonData.length} 行无效数据)`);

            // --- 准备 C 表格的数据结构 ---
            let cTableData = [];

            // 遍历每一行进行处理
            jsonData.forEach((row, index) => {
                try {
                    let newRow = {};

                    // --- 执行步骤 4: 订单编号处理 ---
                    // 示例：去除空格，转字符串
                    newRow["订单编号"] = String(row["订单编号"]).replace(/\s+/g, '');

                    // --- 执行步骤 5: 日期转换 ---
                    // SheetJS 读出的日期有时是数字序列号，有时是字符串
                    let dateVal = row["下单时间"];
                    if (typeof dateVal === 'number') {
                        // 如果是 Excel 序列号 (例如 44920)
                        const dateObj = XLSX.SSF.parse_date_code(dateVal);
                        newRow["下单时间"] = `${dateObj.y}-${String(dateObj.m).padStart(2,'0')}-${String(dateObj.d).padStart(2,'0')}`;
                    } else {
                        // 如果是字符串，尝试保持原样或简单格式化
                        newRow["下单时间"] = dateVal; 
                    }

                    // --- 执行步骤 6 & 7: 固定值填充 ---
                    newRow["币种"] = "BRL";
                    newRow["平台"] = "Mercado";

                    // --- 执行步骤 8: 商品单价计算 ---
                    // 逻辑：订单金额 / 商品数量
                    let amount = parseFloat(String(row["订单金额"]).replace(/[^\d.-]/g, '')) || 0; // 清理货币符号
                    let qty = parseFloat(row["商品数量"]) || 1;
                    
                    newRow["商品单价"] = (amount / qty).toFixed(2); // 保留两位小数

                    // --- 执行步骤 9: 其他字段复制 (SKU, 名称等) ---
                    newRow["SKU"] = row["SKU"];
                    newRow["商品名称"] = row["商品名称"];

                    // --- 执行步骤 10: 填入店铺网址 ---
                    newRow["店铺网址"] = shopUrl;

                    cTableData.push(newRow);

                } catch (err) {
                    addLog(`处理第 ${index + 1} 行数据出错: ${err.message}`, "error");
                }
            });

            if (cTableData.length === 0) {
                throw new Error("处理后没有生成任何有效数据，请检查源文件格式。");
            }

            // --- 生成新的 Excel 文件 ---
            const newWs = XLSX.utils.json_to_sheet(cTableData);
            const newWb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWb, newWs, "C_Table_Result");
            
            processedWorkbook = newWb; // 保存以便下载
            
            addLog("所有步骤执行完毕，准备就绪。", "info");
            downloadArea.style.display = 'block';

        } catch (error) {
            addLog(`严重错误: ${error.message}`, "error");
            console.error(error);
        } finally {
            btn.disabled = false;
            btn.innerText = "生成 C 表格";
        }
    }

    function downloadFile() {
        if (!processedWorkbook) return;
        // 生成文件名，带时间戳
        const dateStr = new Date().toISOString().slice(0,10);
        XLSX.writeFile(processedWorkbook, `Processed_C_Table_${dateStr}.xlsx`);
    }
</script>

</body>
</html>
